<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00ff9d">
<meta name="description" content="REGiLATOR//TECH — a cyberpunk browser terminal created by Lod of Tech.">
<title>REGiLATOR // TECH // TERMINAL</title>
<style>
:root{--primary:#00ff9d;--secondary:#00ccff;--bg:#050909;--panel:#07100f;--danger:#ff3e3e;--warn:#ffaa00;--muted:#78a99a;--glow:rgba(0,255,157,.45)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--primary);font-family:"Share Tech Mono","Cascadia Mono","Courier New",monospace}
body{min-height:100vh;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#matrix{position:fixed;inset:0;z-index:0;opacity:.12;pointer-events:none}
.app{position:relative;z-index:2;width:min(1400px,96vw);height:min(94vh,1000px);margin:3vh auto;background:rgba(3,8,8,.96);border:1px solid var(--primary);box-shadow:0 0 30px var(--glow),inset 0 0 30px rgba(0,255,157,.08);border-radius:10px;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--primary);background:linear-gradient(90deg,#00150e,#001d27)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}.glitch{font-weight:900;letter-spacing:1px;text-shadow:2px 0 #ff004c,-2px 0 #00ccff}.version{font-size:.72rem;color:var(--secondary);border:1px solid var(--secondary);padding:3px 7px;border-radius:5px}
.controls{display:flex;gap:7px}.ctrl{width:12px;height:12px;border:1px solid currentColor;border-radius:50%;opacity:.75}.ctrl.r{color:var(--danger)}.ctrl.y{color:var(--warn)}.ctrl.g{color:var(--primary)}
main{height:calc(100% - 52px);display:grid;grid-template-columns:1fr 280px;min-height:0}
.terminal{display:flex;flex-direction:column;min-width:0;min-height:0}
.output{flex:1;overflow:auto;padding:18px 20px 10px;scroll-behavior:smooth}
.line{margin:0 0 7px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.cmd{color:var(--secondary)}.ok{color:var(--primary)}.err{color:var(--danger)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.input-wrap{display:flex;align-items:center;gap:9px;padding:12px 16px;border-top:1px solid rgba(0,255,157,.45);background:#040908}
.prompt{font-weight:900;white-space:nowrap}.input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--primary);font:inherit;font-size:1rem}
.sidebar{border-left:1px solid rgba(0,255,157,.3);padding:14px;overflow:auto;background:rgba(0,20,15,.18)}
.card{border:1px solid rgba(0,255,157,.35);padding:12px;margin-bottom:12px;border-radius:7px;background:rgba(0,255,157,.035)}
.card h3{font-size:.8rem;margin:0 0 9px;color:var(--secondary);letter-spacing:1px}
.metric{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin:6px 0}.metric span:last-child{color:#d7fff0;text-align:right}
.badge{display:inline-block;border:1px solid var(--primary);border-radius:20px;padding:4px 8px;font-size:.7rem;margin:3px 2px;color:var(--primary)}
.btn{width:100%;margin:5px 0;padding:8px;border:1px solid var(--primary);background:transparent;color:var(--primary);font:inherit;cursor:pointer;border-radius:4px}.btn:hover{background:var(--primary);color:#00100b;box-shadow:0 0 15px var(--primary)}
.about{max-height:420px;overflow:auto;font-size:.74rem;line-height:1.45;color:#b7d8cd}.about p{margin:0 0 10px}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(0,0,0,.78);padding:20px}.modal.show{display:grid}.modal-box{width:min(900px,96vw);max-height:88vh;overflow:auto;background:#050b0a;border:1px solid var(--primary);box-shadow:0 0 35px var(--glow);padding:18px;border-radius:8px}.modal-box h2{margin-top:0;color:var(--secondary)}.closebtn{float:right;background:none;color:var(--danger);border:1px solid var(--danger);padding:4px 9px;cursor:pointer}
video{max-width:100%;width:720px;background:#000;border:1px solid var(--primary)}
@media(max-width:900px){main{grid-template-columns:1fr}.sidebar{display:none}.app{width:98vw;height:96vh;margin:2vh auto}header{height:48px}.output{padding:14px 12px}.input-wrap{padding:10px 11px}.prompt{font-size:.82rem}.input{font-size:.92rem}}
@media(max-width:480px){.version{display:none}.glitch{font-size:.9rem}.line{font-size:.82rem}.app{border-radius:4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="app">
<header>
  <div class="brand"><span class="glitch">REGiLATOR//TECH</span><span class="version">v3.0 REAL</span></div>
  <div class="controls"><i class="ctrl r"></i><i class="ctrl y"></i><i class="ctrl g"></i></div>
</header>
<main>
<section class="terminal">
  <div id="output" class="output" aria-live="polite"></div>
  <div class="input-wrap">
    <span class="prompt">root@regilator:~$</span>
    <input id="input" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type help and press Enter">
  </div>
</section>
<aside class="sidebar">
  <div class="card"><h3>LIVE BROWSER TELEMETRY</h3>
    <div class="metric"><span>ONLINE</span><span id="m-online">—</span></div>
    <div class="metric"><span>CORES</span><span id="m-cores">—</span></div>
    <div class="metric"><span>MEMORY</span><span id="m-memory">—</span></div>
    <div class="metric"><span>SCREEN</span><span id="m-screen">—</span></div>
    <div class="metric"><span>CONNECTION</span><span id="m-conn">—</span></div>
    <div class="metric"><span>SESSION</span><span id="m-up">—</span></div>
  </div>
  <div class="card"><h3>QUICK ACCESS</h3>
    <button class="btn" data-cmd="help">COMMAND INDEX</button>
    <button class="btn" data-cmd="about">ABOUT CREATOR</button>
    <button class="btn" data-cmd="info">BUILD INFO</button>
    <button class="btn" data-cmd="sysinfo">SYSTEM INFO</button>
    <button class="btn" data-cmd="matrix">MATRIX</button>
    <button class="btn" data-cmd="clear">CLEAR</button>
  </div>
  <div class="card"><h3>CORE TAGS</h3><span class="badge">CYBERPUNK</span><span class="badge">WEB</span><span class="badge">MOBILE</span><span class="badge">DESKTOP</span><span class="badge">OFFLINE-FIRST</span></div>
</aside>
</main>
</div>
<div id="modal" class="modal"><div class="modal-box"><button class="closebtn" id="closeModal">CLOSE</button><div id="modalContent"></div></div></div>

<script>
"use strict";
const BUILD_DATE="28 August 2026";
const ORIGINAL_BUILD="2025 // QUANTUM";
const CREATOR="Lod of Tech";
const start=performance.now();
const out=document.getElementById("output"), input=document.getElementById("input");
const modal=document.getElementById("modal"), modalContent=document.getElementById("modalContent");
const history=[]; let hIndex=0, matrixOn=false, matrixRAF=0, mediaStream=null;
const state={cwd:"/", files:JSON.parse(localStorage.getItem("regilator_files")||'{"README.md":"REGiLATOR//TECH\\nCreator: Lod of Tech\\nBuild: 2025 // QUANTUM","notes.txt":"Local browser workspace."}')};
function saveFiles(){localStorage.setItem("regilator_files",JSON.stringify(state.files))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function print(text,cls="line"){const d=document.createElement("div");d.className=cls;d.textContent=String(text);out.appendChild(d);out.scrollTop=out.scrollHeight}
function commandEcho(s){print("> "+s,"line cmd")}
function openModal(title,body){modalContent.innerHTML=`<h2>${esc(title)}</h2><div class="about">${body}</div>`;modal.classList.add("show")}
document.getElementById("closeModal").onclick=()=>modal.classList.remove("show");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});

const aboutParagraphs=[
"Lod of Tech is the creator name attached to this REGiLATOR//TECH terminal. The project presents technology through a distinctive cyberpunk interface rather than a conventional corporate dashboard.",
"The REGiLATOR identity is built around experimentation with code, interfaces, automation, digital tools and practical technology projects. The terminal format turns those interests into something people can interact with instead of simply read.",
"The creator has worked on the Regilator Tech Industries concept, a technology brand focused on web development, software solutions and IT consulting. The brand language emphasizes building digital products with a strong local Zimbabwean connection.",
"The project carries a Zimbabwean identity in its original branding, including the 🇿🇼 reference used by the wider Regilator Tech concept. That gives the work a clear sense of origin while leaving room for international ambitions.",
"Lod of Tech has also explored futuristic visual design. Neon interfaces, terminal layouts, glitch effects, Matrix-style visuals and high-contrast cyberpunk presentation are recurring creative directions represented by this build.",
"Rather than treating a website as a static page, this project treats the browser like a small operating environment. Commands, live browser information, local storage and interactive effects make the interface feel closer to a personal digital console.",
"The creator has shown interest in making technology approachable through practical projects. The emphasis is not only on how code looks, but on whether someone can open it, interact with it and understand what it is doing.",
"Branding is another visible part of the creator's work. Projects such as Regilator Tech Industries, Titan Tech Investment, Dimika Investments and Popcorn Flix have been used as different creative directions for technology, business and media concepts.",
"The creator has also experimented with social-media-ready visual content. Video editing, captions, watermarks, poster concepts and attention-grabbing designs have been part of the broader creative workflow surrounding the Regilator name.",
"AI-assisted creativity is another area the creator has explored. The goal is often to use modern tools to speed up design, content creation and experimentation while still asking for a human-looking result.",
"Lod of Tech tends to prefer interfaces that feel bold rather than generic. The cyberpunk palette in this terminal uses green and cyan as the main signal colors, with dark backgrounds designed to make the interface glow.",
"This particular terminal started from a browser-based REGiLATOR//TECH concept containing a creator label of LOD OF TECH and a 2025 QUANTUM build label. The enhanced version keeps those identity markers while adding a larger practical command layer.",
"The terminal is designed to work across web, mobile and desktop browsers. It does not require a special operating system, because its core is ordinary HTML, CSS and JavaScript running inside the browser.",
"Some commands can use real browser capabilities, including the current date and time, browser and platform details, screen dimensions, network status, storage estimates, clipboard permissions, notifications, vibration, speech and device media permissions where the browser supports them.",
"The creator's approach can therefore be described as a mixture of coding, branding and digital experimentation. The interface is intentionally playful, but its useful browser commands make it more than a visual mock-up.",
"Security is also important to the design philosophy of a browser terminal. Commands in this build are intentionally limited to safe browser-side actions; they do not pretend that a webpage has unrestricted access to a user's computer or other people's systems.",
"The REGiLATOR name is presented as a digital identity: technical, experimental and visually recognizable. The terminal is one way of turning that identity into an experience that can be demonstrated, customized and expanded.",
"For someone discovering the project, the easiest starting point is `help`, followed by `about`, `info`, `sysinfo`, `browser`, `storage` and `online`. Those commands show the difference between the original visual concept and the more functional browser implementation.",
"At its core, this project represents Lod of Tech's interest in turning ideas into interactive digital experiences. The code can continue evolving, but the central idea remains simple: build something distinctive, useful and memorable, one line of code at a time."
];

function aboutHTML(){return aboutParagraphs.map((p,i)=>`<p><b>${i+1}.</b> ${esc(p)}</p>`).join("")}

function fmtBytes(n){if(!Number.isFinite(n))return "unavailable";const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
function connection(){const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;return c?`${c.effectiveType||"?"} / ${c.downlink??"?"}Mb/s / ${c.rtt??"?"}ms`:"not exposed"}
function sessionUptime(){let s=(performance.now()-start)/1000;let m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}m ${sec}s`}
function browserName(){const ua=navigator.userAgent; if(/Edg\//.test(ua))return"Microsoft Edge";if(/Chrome\//.test(ua))return"Google Chrome";if(/Firefox\//.test(ua))return"Mozilla Firefox";if(/Safari\//.test(ua))return"Safari";return"Browser"}
async function storageInfo(){if(!navigator.storage?.estimate)return"Storage API unavailable";const x=await navigator.storage.estimate();return`Used: ${fmtBytes(x.usage||0)} | Quota: ${fmtBytes(x.quota||0)}`}
function safeCalc(expr){
  const s=expr.replace(/\s+/g,""); if(!s)return"Usage: calc 12*(4+2)";
  if(!/^[0-9+\-*/%().]+$/.test(s))throw Error("Only numbers and + - * / % ( ) are allowed.");
  const toks=s.match(/(?:\d+(?:\.\d+)?)|[()+\-*/%]/g)||[]; if(toks.join("")!==s)throw Error("Invalid expression.");
  const prec={"+":1,"-":1,"*":2,"/":2,"%":2}, vals=[],ops=[];
  const apply=()=>{let b=vals.pop(),a=vals.pop(),o=ops.pop();if(o==="/"&&b===0)throw Error("Division by zero.");vals.push(o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:o==="/"?a/b:a%b)};
  let prev="op";
  for(const t of toks){if(!isNaN(t)){vals.push(Number(t));prev="num"}else if(t==="("){ops.push(t);prev="op"}else if(t===")"){while(ops.at(-1)!=="("){if(!ops.length)throw Error("Mismatched parentheses.");apply()}ops.pop();prev="num"}else{if(prev==="op"&&t!=="-")throw Error("Unexpected operator.");while(ops.length&&ops.at(-1)!=="("&&prec[ops.at(-1)]>=prec[t])apply();ops.push(t);prev="op"}}
  while(ops.length){if(ops.at(-1)==="(")throw Error("Mismatched parentheses.");apply()} if(vals.length!==1)throw Error("Invalid expression.");return vals[0];
}
async function clipboardWrite(t){if(!navigator.clipboard?.writeText)return"Clipboard API unavailable";await navigator.clipboard.writeText(t);return"Copied to clipboard."}
async function clipboardRead(){if(!navigator.clipboard?.readText)return"Clipboard API unavailable";return await navigator.clipboard.readText()}
function matrixStart(){if(matrixOn)return"Matrix already active.";matrixOn=true;const c=document.getElementById("matrix"),ctx=c.getContext("2d");let fs=16,cols,drops;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cols=Math.floor(innerWidth/fs);drops=Array(cols).fill(0).map(()=>Math.random()*-50)}resize();addEventListener("resize",resize);
const chars="01REGILATOR<>[]{}#$%&";function draw(){if(!matrixOn)return;ctx.fillStyle="rgba(0,0,0,.09)";ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--primary");ctx.font=fs+"px monospace";drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fs,y*fs);if(y*fs>innerHeight&&Math.random()>.975)drops[i]=0;drops[i]++});matrixRAF=requestAnimationFrame(draw)}draw();return"Matrix visual activated."}
function matrixStop(){matrixOn=false;cancelAnimationFrame(matrixRAF);const c=document.getElementById("matrix");c.getContext("2d").clearRect(0,0,c.width,c.height);return"Matrix visual stopped."}
function themeCyber(){document.documentElement.style.setProperty("--primary","#00ff9d");document.documentElement.style.setProperty("--secondary","#00ccff");document.documentElement.style.setProperty("--bg","#050909");return"Cyberpunk theme restored."}
function applyColor(x){if(!/^#[0-9a-f]{6}$/i.test(x))return"Use a hex color such as #00ff9d.";document.documentElement.style.setProperty("--primary",x);return`Primary color: ${x}`}
async function requestCamera(){if(!navigator.mediaDevices?.getUserMedia)return"Camera API unavailable.";try{mediaStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});openModal("CAMERA ACCESS",'<video id="cam" autoplay playsinline></video><p>Camera preview is local to this browser tab. Close the window to stop it.</p>');document.getElementById("cam").srcObject=mediaStream;return"Camera permission granted."; }catch(e){return"Camera access was denied or unavailable."}}
function stopMedia(){if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null}return"Media stream stopped."}

const C={
help:()=>`REGiLATOR//TECH COMMAND INDEX
SYSTEM: help clear cls date time datetime uptime whoami creator about info made version status sysinfo browser platform language screen viewport online connection battery cores memory storage cookies url origin protocol path referrer reload back forward
WORKSPACE: pwd ls list tree cd mkdir touch cat write append rm find note notes save load export import download upload
WEB: open search maps share notify vibrate speak stop speaktest fullscreen title zoom reload
VISUAL: matrix matrixoff theme cyber neon amber hacker color bg opacity font scanlines glitch
DEVICE: camera stopcamera mic geolocation battery orientation touch media
UTILS: calc echo repeat random uuid base64encode base64decode jsonencode jsondecode chars wordcount upper lower reverse trim timestamp iso
NETWORK-SAFE: ping dns netdiag headers useragent online
SECURITY-SAFE: permissions secure origin policy privacy
DEMO: demo aboutme facts creator story
Aliases and extra tools are included; type 'commands' for the full count.`,
commands:()=>`COMMAND COUNT: ${Object.keys(C).length}+ browser-safe aliases. Type help for grouped commands.`,
clear:()=>{out.innerHTML="";return"Terminal cleared."},cls:()=>C.clear(),
date:()=>new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"}),
time:()=>new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}),
datetime:()=>new Date().toString(),uptime:()=>`Session uptime: ${sessionUptime()}`,
whoami:()=>`root@regilator — local browser session`,creator:()=>`Creator: ${CREATOR}`,about:()=>{openModal("ABOUT LOD OF TECH",aboutHTML());return"Creator profile opened."},
aboutme:()=>C.about(),info:()=>`REGiLATOR//TECH REAL TERMINAL\nCreator: ${CREATOR}\nOriginal build label: ${ORIGINAL_BUILD}\nEnhanced build date: ${BUILD_DATE}\nRuntime: browser / client-side HTML + CSS + JavaScript\nTarget: web + mobile + desktop browsers`,
made:()=>`Created/enhanced date recorded in this build: ${BUILD_DATE}. Original source build label: ${ORIGINAL_BUILD}.`,
version:()=>`REGiLATOR//TECH v3.0 REAL`,status:()=>`ONLINE: ${navigator.onLine?"YES":"NO"} | SECURE CONTEXT: ${isSecureContext?"YES":"NO"} | SESSION: ${sessionUptime()}`,
sysinfo:()=>`SYSTEM\nBrowser: ${browserName()}\nPlatform: ${navigator.platform||"not exposed"}\nCores: ${navigator.hardwareConcurrency||"not exposed"}\nDevice memory: ${navigator.deviceMemory?navigator.deviceMemory+" GB":"not exposed"}\nScreen: ${screen.width}x${screen.height}\nViewport: ${innerWidth}x${innerHeight}\nLanguage: ${navigator.language}\nOnline: ${navigator.onLine?"YES":"NO"}`,
browser:()=>`${browserName()}\nUA: ${navigator.userAgent}`,platform:()=>navigator.platform||"Platform not exposed",
language:()=>navigator.languages?.join(", ")||navigator.language,screen:()=>`Screen: ${screen.width}x${screen.height} @ ${devicePixelRatio}x`,viewport:()=>`Viewport: ${innerWidth}x${innerHeight}`,
online:()=>`Network reachable according to browser: ${navigator.onLine?"YES":"NO"}`,connection:()=>`Connection: ${connection()}`,
battery:async()=>{if(!navigator.getBattery)return"Battery API unavailable.";const b=await navigator.getBattery();return`Battery: ${Math.round(b.level*100)}% | Charging: ${b.charging?"YES":"NO"}`},
cores:()=>`Logical CPU cores exposed: ${navigator.hardwareConcurrency||"unavailable"}`,
memory:()=>`Approx. device memory exposed by browser: ${navigator.deviceMemory?navigator.deviceMemory+" GB":"unavailable"}`,
storage:async()=>await storageInfo(),storageinfo:async()=>await storageInfo(),
cookies:()=>`document.cookie is ${document.cookie?"available for this page":"empty/unavailable"} (HttpOnly cookies are never exposed).`,
pwd:()=>state.cwd,ls:()=>Object.keys(state.files).map(x=>"📄 "+x).join("\n")||"(empty)",list:()=>C.ls(),tree:()=>`/${Object.keys(state.files).map(x=>"├── "+x).join("\n")}`,
cd:a=>{state.cwd=a[0]||"/";return`Directory: ${state.cwd}`},mkdir:a=>`Browser workspace directories are virtual; requested: ${a.join(" ")||"(name missing)"}`,
touch:a=>{const n=a[0];if(!n)return"Usage: touch filename";state.files[n]=state.files[n]||"";saveFiles();return`Created: ${n}`},
cat:a=>{const n=a[0];return n in state.files?state.files[n]:"File not found: "+(n||"")},write:a=>{const n=a[0],v=a.slice(1).join(" ");if(!n)return"Usage: write file text";state.files[n]=v;saveFiles();return`Wrote ${v.length} characters to ${n}`},
append:a=>{const n=a[0],v=a.slice(1).join(" ");if(!n)return"Usage: append file text";state.files[n]=(state.files[n]||"")+v;saveFiles();return`Appended to ${n}`},
rm:a=>{const n=a[0];if(!n)return"Usage: rm filename";if(!(n in state.files))return"File not found.";delete state.files[n];saveFiles();return`Removed: ${n}`},
find:a=>{const q=a.join(" ").toLowerCase();return Object.entries(state.files).filter(([k,v])=>(k+" "+v).toLowerCase().includes(q)).map(([k])=>k).join("\n")||"No matches."},
note:a=>{const t=a.join(" ");if(!t)return"Usage: note your text";state.files["notes.txt"]=(state.files["notes.txt"]?state.files["notes.txt"]+"\n":"")+new Date().toISOString()+" | "+t;saveFiles();return"Note saved locally."},
notes:()=>C.cat(["notes.txt"]),save:()=>{saveFiles();return"Workspace saved to localStorage."},load:()=>{try{state.files=JSON.parse(localStorage.getItem("regilator_files")||"{}");return"Workspace loaded."}catch{return"Workspace data invalid."}},
export:()=>{const blob=new Blob([JSON.stringify(state.files,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="regilator-workspace.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);return"Workspace export started."},
import:()=>{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state.files=JSON.parse(r.result);saveFiles();print("Import complete.","ok")}catch{print("Invalid JSON workspace.","err")}};r.readAsText(f)};i.click();return"Choose a JSON workspace file."},
download:a=>{const name=a[0]||"regilator.txt",text=a.slice(1).join(" ");const blob=new Blob([text],{type:"text/plain"}),u=URL.createObjectURL(blob),x=document.createElement("a");x.href=u;x.download=name;x.click();setTimeout(()=>URL.revokeObjectURL(u),500);return`Download prepared: ${name}`},
upload:()=>C.import(),open:a=>{if(!a[0])return"Usage: open https://example.com";try{const u=new URL(a[0],location.href);if(!/^https?:$/.test(u.protocol))return"Only http/https URLs are allowed.";window.open(u.href,"_blank","noopener,noreferrer");return"Opened in a new tab."}catch{return"Invalid URL."}},
search:a=>{const q=a.join(" ");if(!q)return"Usage: search your query";window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank","noopener,noreferrer");return"Search opened."},
maps:a=>{const q=a.join(" ");if(!q)return"Usage: maps Dubai";window.open("https://www.google.com/maps/search/"+encodeURIComponent(q),"_blank","noopener,noreferrer");return"Maps search opened."},
share:async()=>{if(!navigator.share)return"Web Share API unavailable on this browser.";await navigator.share({title:"REGiLATOR//TECH",text:"REGiLATOR//TECH — Lod of Tech"});return"Share sheet opened."},
notify:async()=>{if(!("Notification"in window))return"Notifications unavailable.";if(Notification.permission==="denied")return"Notifications are blocked.";const p=await Notification.requestPermission();if(p==="granted"){new Notification("REGiLATOR//TECH",{body:"Browser notification test from Lod of Tech."});return"Notification sent."}return"Notification permission not granted."},

async function run(line){
  const parts=line.match(/"[^"]*"|'[^']*'|\S+/g)||[];let cmd=(parts.shift()||"").toLowerCase();const args=parts.map(x=>x.replace(/^["']|["']$/g,""));
  if(!cmd)return;
  commandEcho(line);
  if(cmd==="clipboardwrite"){const r=await clipboardWrite(args.join(" "));print(r,r.startsWith("Copied")?"ok":"err");return}
  if(cmd==="clipboardread"){try{print(await clipboardRead(),"ok")}catch(e){print("Clipboard read failed: "+e.message,"err")}return}
  if(cmd==="exit"){print("Session remains in this browser tab. Close the tab to exit.","warn");return}
  const fn=C[cmd];
  if(!fn){print(`Command not found: '${cmd}'. Type help.`,"err");return}
  try{const r=await fn(args,line);if(r!==undefined)print(r,typeof r==="string"&&/error|failed|denied|unavailable|not found/i.test(r)?"err":"ok")}catch(e){print("Command error: "+e.message,"err")}
}
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"){const v=input.value.trim();if(v){history.push(v);hIndex=history.length;run(v)}input.value=""}
 else if(e.key==="ArrowUp"){e.preventDefault();if(hIndex>0)input.value=history[--hIndex]}
 else if(e.key==="ArrowDown"){e.preventDefault();if(hIndex<history.length-1)input.value=history[++hIndex];else{hIndex=history.length;input.value=""}}
});
